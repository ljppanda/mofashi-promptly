name: Eval (手动评测)

# 手动触发的评测流水线：验证「F1→F2 模板实例化」是否优于「单次直出」。
# 设计要点：
#  - 仅 workflow_dispatch 触发，不阻塞日常 push/PR（裁判 API 偶发限流，硬门禁会误红）。
#  - 生成端与裁判端可分离：用不同模型当裁判即可做交叉验证，避免「自己评自己」偏差。
#  - 需要两个密钥（在仓库 Settings → Secrets 配置）：
#      EVAL_API_KEY       生成端 Key（如百炼 qwen）
#      EVAL_JUDGE_API_KEY 裁判端 Key（如 deepseek，建议与生成端不同）
#  - 触发方式：Actions 页 → Eval (手动评测) → Run workflow（可直接用默认，或改 provider/model）。
#  - 跑完报告作为 artifact 下载：eval-chain-report。

on:
  workflow_dispatch:
    inputs:
      generator_provider:
        description: "生成端 provider（F1/F2 与单次直出都用它）"
        required: false
        default: "qwen"
      generator_model:
        description: "生成端 model"
        required: false
        default: "qwen-plus"
      judge_provider:
        description: "裁判 provider（交叉验证建议与生成端不同）"
        required: false
        default: "deepseek"
      judge_model:
        description: "裁判 model"
        required: false
        default: "deepseek-chat"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run F1→F2 chain eval (生成端 + 裁判端分离)
        env:
          EVAL_PROVIDER: ${{ github.event.inputs.generator_provider }}
          EVAL_MODEL: ${{ github.event.inputs.generator_model }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_JUDGE_PROVIDER: ${{ github.event.inputs.judge_provider }}
          EVAL_JUDGE_MODEL: ${{ github.event.inputs.judge_model }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
        run: npm run eval:chain

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-chain-report
          path: site/server/scripts/eval_chain_report.md
