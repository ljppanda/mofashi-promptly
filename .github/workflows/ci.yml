name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site/server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/server/package-lock.json

      - name: Install dependencies
        run: |
          # 服务端依赖含 onnxruntime/sharp/tree-sitter 等安装脚本，偶发网络/缓存问题。
          # 失败一次后清缓存重试，并把生命周期脚本输出打出来便于定位。
          npm ci --no-audit --no-fund --foreground-scripts --fetch-retries=5 --fetch-retry-maxtimeout=120000 || {
            echo "::warning::npm ci failed once; clearing npm cache and retrying"
            npm cache clean --force
            npm ci --no-audit --no-fund --foreground-scripts --fetch-retries=5 --fetch-retry-maxtimeout=120000
          }

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Corpus integrity (source ↔ templates.json)
        run: npm run corpus:check

      - name: Unit tests (node:test, offline)
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check frontend (tsc --noEmit)
        run: npm run typecheck

      - name: Build frontend (vite build)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image (docker compose)
        run: |
          # 首次构建失败时清掉 buildx 缓存再重试一次，区分「缓存损坏」与真实构建错误。
          docker compose -f site/docker-compose.yml build || {
            echo "::warning::docker compose build failed once; pruning builder cache and retrying"
            docker builder prune -af
            docker compose -f site/docker-compose.yml build
          }

      - name: Smoke test (up → /healthz → down)
        run: |
          # env_file 在 CI 不存在（.env 被 gitignore），建一个空文件走代码默认值即可
          touch site/server/.env
          docker compose -f site/docker-compose.yml up -d
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then ok=1; echo "healthz OK after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          docker compose -f site/docker-compose.yml down -v
          if [ "$ok" != "1" ]; then echo "SMOKE TEST FAILED"; exit 1; fi
