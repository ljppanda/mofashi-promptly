services:
  ppt-agent:
    build:
      context: .
      args:
        # 历史兼容参数；当前版本不再使用人机验证，留空即可。
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: ppt-agent:local
    container_name: ppt-agent
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # 可选：给 /relay 加共享密钥（设置后前端需带 x-relay-token）。
      # - RELAY_TOKEN=change-me
      # 可选：模型主备切换（服务端持有备用 Key 时启用）
      # - LLM_FALLBACK_PROVIDERS=openrouter:openai/gpt-4o,deepseek:deepseek-chat
      # - LLM_FALLBACK_API_KEY=sk-xxx
      # 可选：LangSmith 用量追踪（默认关闭）
      # - LANGSMITH_API_KEY=lsv2_xxx
    env_file:
      - ./server/.env
    volumes:
      - appdata:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  appdata:
